[project]
name = "notix-nexus-bot"
version = "2.0.0"
description = "NOTIX NEXUS - Discord Intelligence Platform"
requires-python = ">=3.10"
dependencies = [
    "disnake>=2.9.1",
    "uvicorn>=0.34.0",
    "fastapi>=0.115.0",
    "motor>=3.5.1",
    "pymongo>=4.10.1",
    "psutil>=6.1.0",
    "python-dotenv>=1.0.1",
    "aiohttp>=3.10.10",
    "Pillow>=11.0.0",
]

[tool.vercel]
entrypoint = "web.py"
